<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSH Control</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><section id="selector" class="screen active"><div class="eyebrow">CSH LEASING RIGHTS CONTROL</div><h1>Chọn chế độ xem</h1><div class="mode-grid"><button class="mode active" data-mode="cskh">CSKH</button><button class="mode" data-mode="cbld">CBLĐ</button><button class="mode" data-mode="leadership">Lãnh đạo</button></div><div id="selector-fields"><p id="selector-note">Chọn CBLĐ, sau đó chọn CSKH phụ trách.</p><label id="cbld-wrap">CBLĐ<select id="cbld"></select></label><label id="cskh-wrap">CSKH<select id="cskh" disabled></select></label><button id="enter" class="primary" disabled>Vào vùng làm việc</button></div><p class="hint">Đây là phân vùng vận hành, không phải xác thực danh tính người dùng.</p></section><section id="workspace" class="screen"><header class="topbar"><button id="back" class="icon">←</button><div class="grow"><strong id="who"></strong><small id="supervisor"></small></div></header><section class="summary"><div><b id="count-active">0</b><span>Đang xử lý</span></div><div><b id="count-issue">0</b><span>Có vướng mắc</span></div><div><b id="count-overdue">0</b><span>Quá hạn</span></div></section><nav class="tabs"><button data-filter="all" class="active">Công việc</button><button data-filter="issue">Vướng mắc</button><button data-filter="completed">Đã hoàn tất</button></nav><div id="cases" class="case-list"></div><div id="empty" class="empty" hidden>Không có case trong nhóm này.</div></section><section id="cbld-view" class="screen"><header class="topbar"><button id="cbld-back" class="icon">←</button><div class="grow"><strong id="cbld-title">CBLĐ</strong><small>Điều hành nhóm</small></div></header><div id="cbld-body"></div></section><section id="leadership-view" class="screen"><header class="topbar"><button id="leadership-back" class="icon">←</button><div class="grow"><strong>Lãnh đạo</strong><small>Chỉ đọc</small></div></header><div id="leadership-body"></div></section><section id="detail" class="screen"><header class="topbar"><button id="detail-back" class="icon">←</button><div class="grow"><strong id="detail-shop"></strong><small id="detail-state"></small></div></header><div id="detail-body"></div></section></main><script type="module" src="app.js"></script></body></html>
